name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows (VST3 + Standalone)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package Windows zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "${{ inputs.version }}"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path package | Out-Null
          New-Item -ItemType Directory -Force -Path package/licenses | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md package/licenses/
          Copy-Item third_party/rubberband/COPYING package/licenses/RubberBand-COPYING
          Copy-Item third_party/rubberband/COMPILING.md package/licenses/RubberBand-COMPILING.md
          Copy-Item -Recurse third_party/rubberband/src/ext package/licenses/RubberBand-ext
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/VST3/QPitch.vst3 package/
          Copy-Item -Recurse -Force build/QPitch_artefacts/Release/CLAP/QPitch.clap package/
          Compress-Archive -Path package/QPitch.vst3, package/licenses -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-vst3.zip" -Force
          Compress-Archive -Path package/QPitch.clap, package/licenses -DestinationPath "dist/QPitch-$version-${{ matrix.platform }}-clap.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qpitch-${{ matrix.platform }}
          path: dist/*.zip

      # ---------- Release assets ----------
      - name: Attach release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
